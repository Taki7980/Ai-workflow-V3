name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Test tagged Tree-sitter parser pilot
        run: go test -tags treesitter ./internal/indexer -count=1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go build ./cmd/ai-workflow
      - run: go build ./cmd/compat-harness
      - run: go build ./cmd/retrieval-bench

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Enable bubblewrap sandbox backend
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Sandbox integration must run (not skip)
        shell: bash
        run: |
          out="$(go test ./internal/provider -run TestBubblewrapIntegration -count=1 -v)"
          echo "$out"
          grep -q -- "--- PASS: TestBubblewrapIntegration" <<<"$out"
      - name: Process-tree, env-leak and path-confinement tests
        run: go test ./internal/procx ./internal/provider ./internal/workspace ./internal/brief -count=1 -race
      - name: Fuzz hostile inputs
        shell: bash
        run: |
          set -e
          go test ./internal/provider -run '^$' -fuzz '^FuzzParseRecords$' -fuzztime 20s
          go test ./internal/journal -run '^$' -fuzz '^FuzzVerify$' -fuzztime 20s
          go test ./internal/workspace -run '^$' -fuzz '^FuzzRemoteIdentity$' -fuzztime 20s
          go test ./internal/verify -run '^$' -fuzz '^FuzzSplitCommand$' -fuzztime 20s

  workflow-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Checkout pinned V2 oracle
        uses: actions/checkout@v7
        with:
          repository: Taki7980/ai-workflow-control-plane-v2
          ref: 554302c378f69809fbd09ff001eb7cfdb9af5005
          path: .compat/v2
          persist-credentials: false
      - name: V3 must clear V2's own benchmark floors on V2's sample tasks
        shell: bash
        run: |
          sudo apt-get install -y -qq ripgrep
          go build -o /tmp/aiw ./cmd/ai-workflow
          cd .compat/v2
          /tmp/aiw setup --no-crg-sync > /dev/null
          /tmp/aiw benchmark --tasks benchmarks/sample-tasks.json --output /tmp/bench.json > /dev/null
          python3 - <<'PY'
          import json, sys
          s = json.load(open("/tmp/bench.json"))["summary"]
          floors = json.load(open("benchmarks/baseline.json"))["minimum"]
          floors["mean_recall_at_k"] = 0.60          # V3 regression floor
          ceilings = {"mean_estimated_context_tokens": 650}  # V3 efficiency ceiling (V2 baseline 376.62)
          bad = [f"{k}={s.get(k)} < {v}" for k, v in floors.items() if (s.get(k) or 0) < v]
          bad += [f"{k}={s.get(k)} > {v}" for k, v in ceilings.items() if s.get(k) is None or s[k] > v]
          print(json.dumps({k: s.get(k) for k in [*floors, *ceilings]}, indent=1))
          sys.exit("benchmark gate failed: " + "; ".join(bad) if bad else 0)
          PY

  installer:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Build fake release
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p rel
          os="$(go env GOOS)"; arch="$(go env GOARCH)"; ext=""
          [ "$os" = windows ] && ext=".exe"
          go build -trimpath -ldflags "-X github.com/Taki7980/ai-workflow-v3/internal/version.Version=9.9.9" \
            -o "rel/ai-workflow-v9.9.9-${os}-${arch}${ext}" ./cmd/ai-workflow
          cd rel && (command -v sha256sum >/dev/null && sha256sum ai-workflow-* || shasum -a 256 ai-workflow-*) > SHA256SUMS
      - name: Serve release on localhost
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory rel >/dev/null 2>&1 &
          sleep 2
      - name: install.sh
        if: runner.os != 'Windows'
        env:
          AI_WORKFLOW_VERSION: "9.9.9"
          AI_WORKFLOW_TEST_RELEASE_BASE: http://127.0.0.1:8765
          AI_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}/aiw
        run: |
          sh install.sh
          test "$("$AI_WORKFLOW_INSTALL_DIR/ai-workflow" version)" = "9.9.9"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          AI_WORKFLOW_VERSION: "9.9.9"
          AI_WORKFLOW_TEST_RELEASE_BASE: http://127.0.0.1:8765
          AI_WORKFLOW_INSTALL_DIR: ${{ runner.temp }}\aiw
        run: |
          ./install.ps1
          if ((& "$env:AI_WORKFLOW_INSTALL_DIR\ai-workflow.exe" version) -ne '9.9.9') { exit 1 }

  retrieval-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Enforce frozen retrieval baseline
        run: go run ./cmd/retrieval-bench --fixture benchmarks/retrieval/baseline.json --enforce
      - name: Enforce MMR selector benchmark
        run: go run ./cmd/retrieval-bench --fixture benchmarks/retrieval/selector.json --enforce

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V3
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Checkout pinned V2 oracle
        uses: actions/checkout@v7
        with:
          repository: Taki7980/ai-workflow-control-plane-v2
          ref: 554302c378f69809fbd09ff001eb7cfdb9af5005
          path: .compat/v2
          persist-credentials: false
      - name: Regenerate V2 golden contracts
        shell: bash
        run: |
          python tools/compat/capture_v2.py \
            --v2-root .compat/v2 \
            --cases compat/cases.json \
            --output /tmp/v2-contracts.json \
            --expected-commit "$(cat compat/v2.lock)"
      - name: Verify frozen fixtures are current
        run: python tools/compat/verify_fixture.py compat/fixtures/v2-contracts.json /tmp/v2-contracts.json
      - name: Execute V3 against V2 contracts
        run: go run ./cmd/compat-harness --cases compat/cases.json --fixtures compat/fixtures/v2-contracts.json --lock compat/v2.lock

  parser-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Verify module files are tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify default build is CGO-free
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          go build -o /tmp/ai-workflow-cgo-free ./cmd/ai-workflow
      - name: Verify incremental freshness counters
        run: go test ./internal/indexer -run '^TestIncrementalCounterContract$' -count=1
      - name: Run tagged parser pilot tests
        run: go test -tags treesitter ./internal/indexer -count=1
      - name: Vet tagged parser pilot
        run: go vet -tags treesitter ./internal/indexer
      - name: Measure parser pilot performance
        run: go test -tags treesitter ./internal/indexer -run '^$' -bench BenchmarkParserPilot -benchmem -benchtime=50x
      - name: Measure incremental index freshness
        run: go test ./internal/indexer -run '^$' -bench 'BenchmarkIndex(Full|Incremental)' -benchmem -benchtime=20x
      - name: Measure parser pilot binary size
        shell: bash
        run: |
          go build -o /tmp/ai-workflow-default ./cmd/ai-workflow
          go build -tags treesitter -o /tmp/ai-workflow-treesitter ./cmd/ai-workflow
          default_size="$(stat -c%s /tmp/ai-workflow-default)"
          tagged_size="$(stat -c%s /tmp/ai-workflow-treesitter)"
          delta="$((tagged_size - default_size))"
          echo "PARSER_PILOT_BINARY_SIZE default_bytes=$default_size tagged_bytes=$tagged_size delta_bytes=$delta"
      - name: Report pinned parser modules
        run: go list -m github.com/tree-sitter/go-tree-sitter github.com/tree-sitter/tree-sitter-python github.com/tree-sitter/tree-sitter-javascript github.com/tree-sitter/tree-sitter-typescript
