name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Test tagged Tree-sitter parser pilot
        run: go test -tags treesitter ./internal/indexer -count=1

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - run: go build ./cmd/ai-workflow
      - run: go build ./cmd/compat-harness
      - run: go build ./cmd/retrieval-bench

  retrieval-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Enforce frozen retrieval baseline
        run: go run ./cmd/retrieval-bench --fixture benchmarks/retrieval/baseline.json --enforce
      - name: Enforce MMR selector benchmark
        run: go run ./cmd/retrieval-bench --fixture benchmarks/retrieval/selector.json --enforce

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V3
        uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Checkout pinned V2 oracle
        uses: actions/checkout@v7
        with:
          repository: Taki7980/ai-workflow-control-plane-v2
          ref: 554302c378f69809fbd09ff001eb7cfdb9af5005
          path: .compat/v2
          persist-credentials: false
      - name: Regenerate V2 golden contracts
        shell: bash
        run: |
          python tools/compat/capture_v2.py \
            --v2-root .compat/v2 \
            --cases compat/cases.json \
            --output /tmp/v2-contracts.json \
            --expected-commit "$(cat compat/v2.lock)"
      - name: Verify frozen fixtures are current
        run: python tools/compat/verify_fixture.py compat/fixtures/v2-contracts.json /tmp/v2-contracts.json
      - name: Execute V3 against V2 contracts
        run: go run ./cmd/compat-harness --cases compat/cases.json --fixtures compat/fixtures/v2-contracts.json --lock compat/v2.lock

  parser-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: true
      - name: Verify default build is CGO-free
        env:
          CGO_ENABLED: "0"
        run: |
          go test ./...
          go build -o /tmp/ai-workflow-cgo-free ./cmd/ai-workflow
      - name: Run tagged parser pilot tests
        run: go test -tags treesitter ./internal/indexer -count=1
      - name: Vet tagged parser pilot
        run: go vet -tags treesitter ./internal/indexer
      - name: Measure parser pilot performance
        run: go test -tags treesitter ./internal/indexer -run '^$' -bench BenchmarkParserPilot -benchmem -benchtime=50x
      - name: Measure parser pilot binary size
        shell: bash
        run: |
          go build -o /tmp/ai-workflow-default ./cmd/ai-workflow
          go build -tags treesitter -o /tmp/ai-workflow-treesitter ./cmd/ai-workflow
          default_size="$(stat -c%s /tmp/ai-workflow-default)"
          tagged_size="$(stat -c%s /tmp/ai-workflow-treesitter)"
          delta="$((tagged_size - default_size))"
          echo "PARSER_PILOT_BINARY_SIZE default_bytes=$default_size tagged_bytes=$tagged_size delta_bytes=$delta"
      - name: Report pinned parser modules
        run: go list -m github.com/tree-sitter/go-tree-sitter github.com/tree-sitter/tree-sitter-python github.com/tree-sitter/tree-sitter-javascript github.com/tree-sitter/tree-sitter-typescript
