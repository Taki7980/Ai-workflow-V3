name: Release

on:
  push:
    tags: ["v*.*.*"]
  # Every main push that passes CI ships as the next patch release, so the
  # installers and `go install ...@latest` always get current main. Push a
  # vX.Y.0 tag by hand for a minor or major release.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time, so two quick pushes never compute the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    if: github.event_name == 'push' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0 # every tag, to pick the next version
          persist-credentials: false
      - name: Resolve version
        id: tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'
          sha="$(git rev-parse HEAD)"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            # A run finishing after a newer push must not ship older code under a newer version.
            main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [ "$main" != "$sha" ]; then
              echo "main has moved past $sha; the newer run releases"
              exit 0
            fi
            for t in $(git tag --points-at HEAD); do
              if [[ "$t" =~ $semver ]]; then
                echo "$sha is already released as $t"
                exit 0
              fi
            done
            last=v0.0.0
            for t in $(git tag --list 'v*' --sort=-v:refname); do
              if [[ "$t" =~ $semver ]]; then
                last="$t"
                break
              fi
            done
            IFS=. read -r major minor patch <<< "${last#v}"
            tag="v$major.$minor.$((patch + 1))"
          fi
          [[ "$tag" =~ $semver ]] || { echo "tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  release:
    needs: version
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the tag and GitHub release
      id-token: write      # sign build provenance
      attestations: write  # publish build provenance
    env:
      TAG: ${{ needs.version.outputs.tag }}
      SHA: ${{ needs.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false # never restore a cache into a release build
      - run: go vet ./...
      - run: go test ./...
      - name: Build static binaries
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/Taki7980/ai-workflow-v3/internal/version.Version=${version}" \
              -o "dist/ai-workflow-v${version}-${os}-${arch}${ext}" ./cmd/ai-workflow
          done
          (cd dist && sha256sum ai-workflow-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Smoke-test linux binary
        run: |
          v="${TAG#v}"
          test "$(dist/ai-workflow-v${v}-linux-amd64 version)" = "$v"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/ai-workflow-*"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # --target creates the tag for automatic releases; a pushed tag already exists.
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$SHA" --generate-notes
