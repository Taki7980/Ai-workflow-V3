name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release
      id-token: write      # sign build provenance
      attestations: write  # publish build provenance
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
          cache: false # never restore a cache into a release build
      - name: Validate tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - name: Build static binaries
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            [ "$os" = windows ] && ext=".exe"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -buildid= -X github.com/Taki7980/ai-workflow-v3/internal/version.Version=${version}" \
              -o "dist/ai-workflow-v${version}-${os}-${arch}${ext}" ./cmd/ai-workflow
          done
          (cd dist && sha256sum ai-workflow-* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Smoke-test linux binary
        run: |
          v="${GITHUB_REF_NAME#v}"
          test "$(dist/ai-workflow-v${v}-linux-amd64 version)" = "$v"
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/ai-workflow-*"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
